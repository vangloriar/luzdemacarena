<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uma Casa Inteligente</title>

    <style>
       
        body {
            background: linear-gradient(135deg, #090d16 0%, #111827 50%, #0f172a 100%);
            color: #f8fafc;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        
        .painel {
            width: 360px;
            margin: 20px auto;
            padding: 28px 24px;
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            transition: all 0.4s ease;
        }

        .painel.ligado {
            border-color: rgba(250, 204, 21, 0.4);
            box-shadow: 0 20px 50px rgba(250, 204, 21, 0.15);
        }

        
        h2 {
            margin-top: 0;
            font-size: 1.5rem;
            letter-spacing: 0.5px;
            color: #f8fafc;
        }

        h1 {
            font-size: 1.25rem;
            margin: 15px 0 5px 0;
            color: #94a3b8;
            transition: color 0.3s;
        }

        .painel.ligado h1 {
            color: #fef08a;
        }

       
        .foto {
            width: 100%;
            height: 180px; 
            object-fit: cover;
            border-radius: 14px;
            filter: brightness(0.5) contract(0.9);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        .painel.ligado .foto {
            filter: brightness(1.1) contrast(1.05);
            box-shadow: 0 0 20px rgba(250, 204, 21, 0.2);
        }

        .iluminacao-area {
            margin: 20px 0;
            padding: 15px;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 16px;
            position: relative;
        }

        
        .icone {
            width: 80px; 
            height: auto;
            fill: #64748b;
            transition: all 0.4s ease;
            filter: drop-shadow(0 0 0px transparent);
        }

        .painel.ligado .icone {
            fill: #facc15;
            filter: drop-shadow(0 0 12px rgba(250, 204, 21, 0.8));
            transform: scale(1.05);
        }

        
        .logo {
            width: 90px; 
            height: auto;
            opacity: 0.4;
            transition: all 0.4s ease;
            margin: 10px 0;
        }

        .painel.ligado .logo {
            opacity: 1;
            filter: drop-shadow(0 0 15px rgba(250, 204, 21, 0.6));
        }

        
        .gif {
            width: 45px;
            height: auto;
            opacity: 0.1;
            transition: opacity 0.4s ease;
            mix-blend-mode: screen;
            vertical-align: middle;
        }

        .painel.ligado .gif {
            opacity: 1;
            animation: pulsarBrilho 1.5s infinite alternate;
        }

        @keyframes pulsarBrilho {
            0% { transform: scale(0.9); opacity: 0.7; }
            100% { transform: scale(1.15); opacity: 1; }
        }

       
        button {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); /* Cor amarela/âmbar modificada */
            color: #0f172a;
            padding: 14px 30px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
            transition: all 0.3s ease;
            margin-top: 15px;
            outline: none;
        }

        button:hover {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(250, 204, 21, 0.5);
        }

        button:active {
            transform: translateY(1px);
        }

       
        #resultado {
            font-size: 1rem;
            font-weight: 600;
            margin-top: 15px;
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
            background: rgba(255, 255, 255, 0.05);
            color: #94a3b8;
            transition: all 0.3s ease;
        }

        .painel.ligado #resultado {
            background: rgba(250, 204, 21, 0.15);
            color: #fef08a;
            border: 1px solid rgba(250, 204, 21, 0.3);
        }
    </style>
</head>

<body>

    <div class="painel" id="painelControl">

        <h2>Casa Inteligente</h2>

       
        <img src="https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=800&q=80" class="foto" alt="Fotografia da Sala de Estar">

        <div class="iluminacao-area">
           
            <svg class="icone" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.87-3.13-7-7-7zm-2 17h4v1h-4v-1zm1 3h2v1h-2v-1z"/>
            </svg>

            <h1>Ligue essa luz ae, rapá</h1>

           
            <img src="https://raw.githubusercontent.com/feathericons/feather/master/icons/sun.svg" class="logo" alt="Ilustração PNG Transparente">

            <br>

            
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExdWszcXd0bnc3aWFudmllY3RwbmZ3bnF2Ymxub3BvdjdzcnQwdzF1bSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3o7TKSjRrfIPjeiVyM/giphy.gif" class="gif" alt="Efeito de Brilho Animado">
        </div>

       
        <button onclick="alternarLuz()" id="btnLuz">Ligar luz</button>

        <p id="resultado">Luz desligada</p>

    </div>

   
    <script>
        let isLigado = false;

        function alternarLuz() {
            isLigado = !isLigado;
            
            const painel = document.getElementById("painelControl");
            const resultado = document.getElementById("resultado");
            const btn = document.getElementById("btnLuz");

            if (isLigado) {
                
                resultado.innerHTML = "💡 Luz ligada!";
                btn.innerHTML = "Desligar luz";
                painel.classList.add("ligado");
            } else {
                resultado.innerHTML = "Luz desligada";
                btn.innerHTML = "Ligar luz";
                painel.classList.remove("ligado");
            }
        }
    </script>

</body>
</html>
